<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7dbc0">
<title>Red Dead Redemption II Crafting Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="images/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">

<!-- Before the first paint, so a reader who chose leather never sees
     parchment flash first.  Inline for the same reason: a separate
     file would be a round trip to wait on.

     The stylesheet above blocks this script, so by here app.css has
     been applied and the theme's own --bg can be read back out of it
     rather than written a second time in this file. -->
<script>
try {
  var t = localStorage.getItem('rdr2:theme');
  document.documentElement.dataset.theme = t === 'leather' ? 'leather' : 'parchment';

  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
} catch (e) { /* private mode: the default is fine */ }
</script>
</head>
<body>

<!-- Top bar and tabs travel together, so on a wide screen the tabs
     stick under the bar instead of below the content. -->
<div class="chrome">
  <header class="topbar">
    <h1>
      <img class="brand-mark" src="images/logo-128.png" alt="" width="34" height="34">
      <span class="brand-text">
        <span class="brand-game">Red Dead Redemption II</span>
        <span class="brand-app">Crafting Guide</span>
      </span>
    </h1>
    <label class="mode" title="Personal mode tracks what you have; general mode is the plain reference.">
      <input type="checkbox" id="mode-toggle">
      <span>Personal</span>
    </label>
  </header>

  <nav class="tabs">
    <a href="#/materials" data-route="materials">Materials</a>
    <a href="#/recipes"   data-route="recipes">Recipes</a>
    <a href="#/inventory" data-route="inventory">Inventory</a>
    <a href="#/settings"  data-route="settings">Settings</a>
  </nav>
</div>

<h2 class="page-title" id="page-title"></h2>

<main id="view" aria-live="polite">
  <!-- first-load skeleton; replaced once the database is open -->
  <div class="skeleton">
    <p class="loading">Opening the database…</p>
    <div class="gallery">
      <div class="card ghost"></div><div class="card ghost"></div>
      <div class="card ghost"></div><div class="card ghost"></div>
    </div>
  </div>
</main>

<!-- In normal flow at the foot of the document rather than pinned: on a
     phone the body's bottom padding already clears the fixed tab bar,
     and a credit line is not worth a second fixed element. -->
<footer class="footer">
  <p><span class="sym">&copy;</span> 2026 - Made with love by
     <span class="by">Arindam Bose</span>,
     powered by <span class="by">Claude</span></p>
</footer>

<div id="toast" class="toast" hidden></div>

<!-- A classic script, not a module: on file:// the modules below are
     blocked by CORS and never run, so this has to be what explains it. -->
<script>
if (location.protocol === 'file:') {
  document.getElementById('view').innerHTML =
    '<div class="error"><h2>This needs to be served over HTTP.</h2>' +
    '<p>Opened from a file path, the browser gives every file the origin ' +
    '<code>null</code> and blocks the modules and the database fetch.</p>' +
    '<p>From the project folder, run <code>python3 -m http.server 8000</code> ' +
    'and open <a href="http://localhost:8000">http://localhost:8000</a>.</p></div>';
}
</script>

<!-- sql.js ships as a classic script that defines window.initSqlJs -->
<script src="vendor/sql-wasm.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
