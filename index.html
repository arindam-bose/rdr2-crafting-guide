<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1613">
<title>RDR2 Crafting Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Top bar and tabs travel together, so on a wide screen the tabs
     stick under the bar instead of below the content. -->
<div class="chrome">
  <header class="topbar">
    <h1>Crafting Guide</h1>
    <label class="mode" title="Personal mode tracks what you have; general mode is the plain reference.">
      <input type="checkbox" id="mode-toggle">
      <span>Personal</span>
    </label>
  </header>

  <nav class="tabs">
    <a href="#/materials" data-route="materials">Materials</a>
    <a href="#/recipes"   data-route="recipes">Recipes</a>
    <a href="#/inventory" data-route="inventory">Inventory</a>
    <a href="#/settings"  data-route="settings">Settings</a>
  </nav>
</div>

<h2 class="page-title" id="page-title"></h2>

<main id="view" aria-live="polite">
  <!-- first-load skeleton; replaced once the database is open -->
  <div class="skeleton">
    <p class="loading">Opening the database…</p>
    <div class="gallery">
      <div class="card ghost"></div><div class="card ghost"></div>
      <div class="card ghost"></div><div class="card ghost"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast" hidden></div>

<!-- A classic script, not a module: on file:// the modules below are
     blocked by CORS and never run, so this has to be what explains it. -->
<script>
if (location.protocol === 'file:') {
  document.getElementById('view').innerHTML =
    '<div class="error"><h2>This needs to be served over HTTP.</h2>' +
    '<p>Opened from a file path, the browser gives every file the origin ' +
    '<code>null</code> and blocks the modules and the database fetch.</p>' +
    '<p>From the project folder, run <code>python3 -m http.server 8000</code> ' +
    'and open <a href="http://localhost:8000">http://localhost:8000</a>.</p></div>';
}
</script>

<!-- sql.js ships as a classic script that defines window.initSqlJs -->
<script src="vendor/sql-wasm.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
